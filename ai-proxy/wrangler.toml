name = "tyreguru-ai"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
MODEL = "claude-sonnet-5-5"
PER_IP_DAILY = "20"
DAILY_LIMIT = "300"

# Optional: keeps the daily limits across restarts. Create with `npx wrangler kv namespace create LIMITS`,
# then paste the id here and remove the leading #.
# [[kv_namespaces]]
# binding = "LIMITS"
# id = "PASTE_ID_HERE"
