<title>TyreGuru</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone-style single column app with bottom tab bar; wide screens center it as a 760px column. */
:root{--bg:#f4f3ef;--card:#fff;--ink:#23211f;--mute:#6b6760;--line:#dcd9d1;--frame:#3a3a3a;--red:#d6362c;--redbg:#fae4e2;--green:#3e8e3e;--greenbg:#e2f0e2;--accent:#3a3a3a;
--disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--card:#262523;--ink:#efede8;--mute:#a09b92;--line:#3a3835;--frame:#d8d5ce;--red:#ff6b60;--redbg:#43211f;--green:#6fcb6f;--greenbg:#1f3a1f;--accent:#d8d5ce;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a19;--card:#262523;--ink:#efede8;--mute:#a09b92;--line:#3a3835;--frame:#d8d5ce;--red:#ff6b60;--redbg:#43211f;--green:#6fcb6f;--greenbg:#1f3a1f;--accent:#d8d5ce;color-scheme:dark}
/* Permanent black theme, like the original design */
:root,:root[data-theme]{--bg:#000;--card:#000;--ink:#f2f0eb;--mute:#a9a49b;--line:#34312e;--frame:#d8d5ce;--red:#ff5a4f;--redbg:#000;--green:#4fd06a;--greenbg:#000;--accent:#d8d5ce;color-scheme:dark}
html,body{background:#000}.tag.red,.tag.green{color:#111}
/* Status colors. The color-blind palette (Okabe-Ito blue / yellow / vermillion) is chosen in Settings; patterns are always on. */
:root{--zl:#e53935;--zo:#f2b01e;--zg:#25b34f;--zh:#9b59d6;--tl:#ff6b60;--to:#ffd04a;--tg:#4cd964;--th:#b98cf0}
html[data-cb="1"]{--zl:#d55e00;--zo:#f0e442;--zg:#0072b2;--zh:#cc79a7;--tl:#ff9a4d;--to:#f0e442;--tg:#56b4e9;--th:#e29bc2;--red:#ff8a3d;--green:#56b4e9}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 62px) 24px}
.wrap{max-width:760px;margin:0 auto}h1,h2,h3{font-family:var(--disp);letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px;margin-bottom:8px}h3{font-size:17px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0}
.sg{position:fixed;z-index:60;background:var(--card);color:inherit;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45);overflow-y:auto;-webkit-overflow-scrolling:touch}.sg [role=option]{padding:11px 14px;min-height:44px;box-sizing:border-box;display:flex;align-items:center;border-top:1px solid var(--line);font-size:16px}.sg [role=option]:first-child{border-top:0}.sg .add{font-weight:600}.sg .note{padding:12px 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;min-width:0}
.big{border-width:2px}.big.red{border-color:var(--red);background:#000}.big.green{border-color:var(--green);background:#000}
.tag{display:inline-block;font:700 13px var(--disp);letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:4px;color:#fff}
.card.stale{border-style:dashed;border-color:var(--mute)}.card.stale .gcard{filter:saturate(.35);opacity:.72}.stalenote{margin:8px 0;padding:8px 10px;border:2px solid var(--yel,#e6a817);border-radius:8px}
.stalemodal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px}.stalemodal .box{background:var(--card);color:var(--ink);border:3px solid var(--yel,#e6a817);border-radius:12px;max-width:420px;padding:18px}
.tag.red{background:var(--red);color:#fff}.tag.green{background:var(--green);color:#fff}.tag.grey{background:var(--mute)}
:root[data-theme="dark"] .tag.red,:root[data-theme="dark"] .tag.green{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.red,:root:not([data-theme="light"]) .tag.green{color:#111}}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 3px}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
button{background:var(--frame);color:var(--bg);border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.warn{background:var(--red);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:8px 0 4px}.meter i{display:block;height:100%}
.meter.red i{background:var(--red)}.meter.green i{background:var(--green)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}.kv b{text-align:right}
.mute{color:var(--mute);font-size:13px}.num{font:700 40px/1 var(--disp);font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:center;padding:calc(6px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
nav .in{display:flex;max-width:760px;width:100%;gap:4px}nav button{flex:1;background:transparent;color:var(--mute);padding:8px 2px;font:600 13px var(--disp);letter-spacing:.08em;text-transform:uppercase}
nav button[aria-current=true]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.seg{display:flex;border:2px solid var(--frame);border-radius:8px;overflow:hidden;margin:8px 0 12px}.seg button{flex:1;background:transparent;color:var(--ink);border:0;border-radius:0;padding:9px 4px;font:600 13px var(--disp);letter-spacing:.06em;text-transform:uppercase}.seg button[aria-current=true]{background:var(--frame);color:var(--bg)}
.gcard{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.gcol{text-align:center;min-width:0}.gcol svg{width:100%;max-width:176px;height:auto}.gcol b{display:block;font:700 20px/1.15 var(--disp);margin-top:2px}.gin{text-align:left;margin-top:8px}.gin label{display:block;font-size:12px;margin-bottom:3px;color:var(--mute)}.gcol small{display:block;color:var(--mute);font-size:12px}.gcol.red b{color:var(--red)}
.sboxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.sbox{border:2px solid var(--frame);border-radius:8px;padding:8px 12px;background:var(--card)}.sbox small{display:block;color:var(--mute);font-size:12px}.sbox b{font:700 21px/1.15 var(--disp)}.sbox.red{border-color:var(--red);background:var(--redbg)}
.fix{font:700 26px/1.2 var(--disp);margin:6px 0}.tap{cursor:pointer}.bikesel{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--frame);border-radius:10px;padding:10px 14px;background:var(--card);font:600 16px var(--body);cursor:pointer}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.stat{border:1px solid var(--frame);border-radius:8px;padding:10px 12px;background:var(--card);margin:8px 0}

<script>
/* ===== TyreGuru core: pure functions, no DOM ===== */
const TG = (() => {
  const DAY = 86400000;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const round = (x, n = 0) => { const p = Math.pow(10, n); return Math.round(x * p) / p; };

  /* ---------- editable assumptions (all untested placeholders) ---------- */
  const DEFAULTS = {
    refLifeDays: 135,        // midpoint of Stan's 2 to 7 months, at 20 C
    refTempC: 20,
    q10: 2,                  // drying rate doubles per 10 C (evaporation rule of thumb)
    pavementOffsetC: 8,      // extra heat on ride hours (hypothesis)
    typicalTempC: 20,        // used for days with no ride temperature
    conditionFactor: { new: 1.0, good: 1.0, fair: 1.1, poor: 1.25 },
    triggerFraction: 0.4,    // add sealant when less than 40% of a full dose is left
    leakPctPerDay: 1.5,      // tubeless air loss, percent of gauge pressure per day
    airTolPsi: 3,            // red when this far below target
    airTolPct: 0.05,
    learnWeight: 0.6,
    dayPerKm: 0.02,          // wear: effective days of sealant use per km (hypothesis)
    trafficMaxC: 1.0,        // most a traffic jam can add to road temperature, degrees C (hypothesis, not measured)
    mlPerSealEvent: 3,       // sealant used up by one puncture seal (hypothesis)
    roadK: 0.45, absAsphalt: 0.85,        // how far one sealant check moves the life estimate
  };

  /* ---------- sealant database ----------
     Each product: name, family, formula, aliases (old saved names), dose tables per tire type as [widthMm, ml] points
     (linear between points, held flat outside), life claim, and where the numbers came from.
     src "maker" = manufacturer page; "secondary" = retailer or reviewer quoting the maker, unverified; null = no maker figure, generic dose used.
     This list can be replaced at launch by a hosted sealants.json (see loadRemoteSealants in the app). */
  const SEALANT_DATA = {version:1, updated:"2026-11-08", generic:{road:[[28,50],[32,55],[40,60],[45,80],[50,95]],gravel:[[28,50],[32,55],[40,60],[45,80],[50,95]],mtb:[[51,95],[53,100],[56,100],[58,105],[61,110],[64,125],[71,130],[76,140]]},
   products:[
    {id:"stans-original",checkMonths:"3",name:"Stan's Original / Race Day",family:"Stan's",formula:"Original and Race Day",aliases:["Stan's NoTubes","Stan's NoTubes Original"],
     dose:{road:[[28,50],[32,55],[40,60],[45,80],[50,95]],gravel:[[28,50],[32,55],[40,60],[45,80],[50,95]],mtb:[[51,95],[53,100],[56,100],[58,105],[61,110],[64,125],[71,130],[76,140],[102,175],[127,230]]},
     src:"maker",srcUrl:"https://stans.com/pages/how-much-sealant",note:"Stan's chart gives Original and Race Day the same amounts, including fat bike (26 x 4 in 175 ml, 26 x 5 in 230 ml)."},
    {id:"stans-rolled-gold",checkMonths:"3",name:"Stan's Rolled Gold",family:"Stan's",formula:"Rolled Gold",aliases:[],
     dose:{road:[[28,35],[32,40],[40,50],[45,60],[50,70]],gravel:[[28,35],[32,40],[40,50],[45,60],[50,70]],mtb:[[51,70],[53,75],[56,75],[58,80],[61,80],[64,85]]},
     src:"maker",srcUrl:"https://stans.com/pages/how-much-sealant",note:"Lower amounts than Original. Stan's lists no Rolled Gold amount for tires wider than 2.5 inch."},
    {id:"mucoff-road-gravel",checkMonths:"3 to 6",name:"Muc-Off road and gravel",family:"Muc-Off",formula:"Road and Gravel",aliases:["Muc-Off No Puncture Hassle"],
     dose:{road:[[23,45],[28,45],[30,75],[45,75],[50,75]],gravel:[[23,45],[28,45],[30,75],[45,75],[50,75]],mtb:[[51,67],[64,122],[76,140]]},lifeMaxDays:180,
     src:"secondary",srcUrl:"https://muc-off.com/blogs/how-to-hub/how-to-use-muc-off-no-puncture-hassle-tubeless-sealant",note:"Road 23-28c 30-60 ml (45 used), gravel 30-45c 70-80 ml (75 used), as summarized from Muc-Off's guide. Muc-Off's own product page lists 60-75 ml for 700c cross tires. Lasts 6+ months; check every 750 miles."},
    {id:"mucoff-mtb",checkMonths:"6",name:"Muc-Off mountain bike",family:"Muc-Off",formula:"MTB",aliases:[],
     dose:{road:[[23,45],[28,45],[30,75],[45,75],[50,75]],gravel:[[23,45],[28,45],[30,75],[45,75],[50,75]],mtb:[[51,67],[64,122],[76,140]]},lifeMaxDays:180,
     src:"maker",srcUrl:"https://muc-off.com/blogs/how-to-hub/how-to-use-muc-off-no-puncture-hassle-tubeless-sealant",note:"60-75 ml for 26 and 27.5 inch, 105-140 ml for 29 inch, downhill 120-140 ml (midpoints used). Lasts 6+ months."},
    {id:"orange-regular",checkMonths:"3 to 6",name:"Orange Seal Regular",family:"Orange Seal",formula:"Regular",aliases:["Orange Seal"],
     dose:{road:[[28,45],[32,55],[40,60],[45,80],[50,95]],gravel:[[28,45],[32,55],[40,60],[45,80],[50,95]],mtb:[[51,88],[64,118]]},lifeMaxDays:180,
     src:"secondary",srcUrl:"https://nminus1bikes.substack.com/p/quit-guessing-how-much-tubeless-sealant",note:"From summaries of Orange Seal guidance: road 28 mm 30-59 ml (45 used), 27.5 in about 3 oz, 29 in about 4 oz. Other widths use the generic dose. Typically lasts 3 to 6 months; top up 1-2 oz when the slosh drops."},
    {id:"orange-endurance",checkMonths:"3 to 6",name:"Orange Seal Endurance",family:"Orange Seal",formula:"Endurance",aliases:[],
     dose:{road:[[28,45],[32,55],[40,60],[45,80],[50,95]],gravel:[[28,45],[32,55],[40,60],[45,80],[50,95]],mtb:[[51,88],[64,118]]},lifeMaxDays:180,
     src:"secondary",srcUrl:"https://nminus1bikes.substack.com/p/quit-guessing-how-much-tubeless-sealant",note:"Same amounts as Regular; no separate Endurance figures found. Typically lasts 3 to 6 months; top up 1-2 oz when the slosh drops."},
    {id:"silca-ultimate-original",name:"Silca Ultimate Original",family:"Silca",formula:"Ultimate Original",aliases:["Silca","Silca Ultimate"],
     dose:{road:[[28,55],[32,65],[40,80],[42,85],[45,90],[50,100]],gravel:[[28,55],[32,65],[40,80],[42,85],[45,90],[50,100]],mtb:[[51,100],[57,115],[61,125],[66,135]]},init:{road:[[30,59],[45,89],[60,118],[76,148],[999,177]],gravel:[[30,59],[45,89],[60,118],[76,148],[999,177]],mtb:[[30,59],[45,89],[56,118],[76,148],[999,177]]},rep:{road:[[30,[30,44,59]],[45,[44,59,89]],[60,[59,89,118]],[76,[74,103,148]],[999,[89,133,177]]],gravel:[[30,[30,44,59]],[45,[44,59,89]],[60,[59,89,118]],[76,[74,103,148]],[999,[89,133,177]]],mtb:[[30,[30,44,59]],[45,[44,59,89]],[56,[59,89,118]],[76,[74,103,148]],[999,[89,133,177]]]},
     src:"maker",srcUrl:"https://silca.gorgias.help/en-US/how-much-sealant-do-i-use-in-my-tire-1265414",note:"Silca Ultimate Sealant Fill Guide, by tire size (700c 28 mm 55 ml up to 50 mm 100 ml; 29 in 2.0 to 2.6 100 to 135 ml). Silca Replenisher is used with the Original: amounts come from Silca's Sealant + Replenisher chart. Pour sealant into the tire."},
    {id:"silca-ultimate-2",checkMonths:"6",name:"Silca Ultimate 2.0",family:"Silca",formula:"Ultimate 2.0",aliases:[],
     dose:{road:[[28,55],[32,65],[40,80],[42,85],[45,90],[50,100]],gravel:[[28,55],[32,65],[40,80],[42,85],[45,90],[50,100]],mtb:[[51,100],[57,115],[61,125],[66,135]]},lifeMaxDays:180,
     src:"maker",srcUrl:"https://silca.gorgias.help/en-US/how-much-sealant-do-i-use-in-my-tire-1265414",note:"Silca Ultimate Sealant Fill Guide, by tire size. No Replenisher with the 2.0: refill with the original formula. Retention up to 6 months."},
    {id:"schwalbe-doc-blue-pro",checkMonths:"2 to 7",name:"Schwalbe Doc Blue Professional",family:"Schwalbe",formula:"Doc Blue Professional",aliases:["Schwalbe Doc Blue"],
     dose:{road:[[23,75],[60,75],[62,105],[100,105]],gravel:[[23,75],[60,75],[62,105],[100,105]],mtb:[[23,75],[60,75],[62,105],[100,105]]},lifeMaxDays:210,
     src:"maker",srcUrl:"https://www.schwalbetires.com/tire-accessories/sealants-mounting-fluids/",note:"60 to 90 ml for 23 to 60 mm tires, 90 to 120 ml for 62 to 100 mm (midpoints used). Effective up to 7 months."},
    {id:"bontrager-tlr",name:"Bontrager TLR",family:"Bontrager",formula:"TLR",aliases:[],dose:null,src:null,note:"No maker amount found. Generic dose used."},
    {id:"other",name:"Other",family:"Other",formula:"",aliases:[],dose:null,src:null,note:"Generic dose used. Follow the label."}
   ]};
  let SEALANTS = SEALANT_DATA.products.slice();
  const BRANDS = SEALANT_DATA.products.map(p => p.name);
  const sealantOf = name => { const n = String(name||'').toLowerCase(); return SEALANTS.find(p => p.name.toLowerCase() === n || (p.aliases||[]).some(x => x.toLowerCase() === n)) || null; };
  const sealantFamily = name => { const p = sealantOf(name); return p ? p.family : String(name||'').split(' ')[0]; };
  function interp(pts, w) { if (!pts || !pts.length) return null; if (w <= pts[0][0]) return pts[0][1]; for (let i = 1; i < pts.length; i++) if (w <= pts[i][0]) { const [x0,y0] = pts[i-1], [x1,y1] = pts[i]; return x1 === x0 ? y1 : y0 + (y1-y0)*(w-x0)/(x1-x0); } return pts[pts.length-1][1]; }
  /* full dose in ml for this width, sealant and tire type. info() also says where the number came from. */
  function doseInfo(widthMm, sealantName, type) {
    const p = sealantOf(sealantName), t = type === 'mtb' ? 'mtb' : (type === 'road' ? 'road' : 'gravel');
    const tbl = p && p.dose ? (p.dose[t] || p.dose.gravel) : null;
    let ml, rep = null, init = null;
    if (p && p.init) { const ib = p.init[t] || p.init.gravel, b = ib.find(x => widthMm <= x[0]) || ib[ib.length - 1]; init = b[1]; }
    if (p && p.rep) { const rb = p.rep[t] || p.rep.gravel, b = rb.find(x => widthMm <= x[0]) || rb[rb.length - 1]; rep = b[1]; }
    if (tbl && tbl.step) { const b = tbl.step.find(x => widthMm <= x[0]) || tbl.step[tbl.step.length - 1]; ml = b[1]; }
    else ml = clamp(round(interp(tbl || SEALANT_DATA.generic[t], widthMm), 0), 30, 250);
    let initEst = false;
    if (init == null) { init = round(ml * 1.15, 0); initEst = true; }
    const half = (p && p.dose && !p.rep) ? round(ml / 2, 0) : null;
    return { initEst, half, chk: p && p.checkMonths ? p.checkMonths : null, rep, init, ml, src: tbl ? p.src : null, url: tbl ? p.srcUrl : null, note: p ? p.note : 'Generic dose. Follow the label.', product: p ? p.name : null };
  }
  const DOSE_LEVELS = { standard: { f: 1, label: 'Standard' }, light: { f: 0.83, label: 'Light Race (about 1.7 oz for a 40 mm tire)' } };
  function fullDoseMl(widthMm, sealantName, type, level) { const ml = doseInfo(widthMm, sealantName, type).ml, f = (DOSE_LEVELS[level] || DOSE_LEVELS.standard).f; return f === 1 ? ml : round(ml * f, 0); }
  /* replace the built-in list with a fetched one (same shape as SEALANT_DATA). Returns true if accepted. */
  function setSealants(j) {
    if (!j || !Array.isArray(j.products) || !j.products.length) return false;
    const ok = j.products.filter(p => p && typeof p.name === 'string' && p.name && (p.dose == null || typeof p.dose === 'object'));
    if (!ok.length) return false;
    if (!ok.some(p => p.name === 'Other')) ok.push(SEALANT_DATA.products[SEALANT_DATA.products.length-1]);
    SEALANTS = ok; BRANDS.length = 0; ok.forEach(p => BRANDS.push(p.name)); return true;
  }

  /* ---------- pressure target (approximation, not Silca or SRAM) ---------- */
  const TERRAIN = {
    smooth:  { k: 463, front: 0.48, label: 'Smooth pavement', fit: 'guess' },
    worn:    { k: 437, front: 0.48, label: 'Worn pavement, some cracks', fit: 'fitted to three Silca results' },
    gravel1: { k: 365, front: 0.47, label: 'Easy gravel', fit: 'guess' },
    gravel4: { k: 278, front: 0.47, label: 'Rough gravel (Silca category 4)', fit: 'fitted to one Silca result' },
    mtb:     { k: 514, front: 0.465, label: 'Mountain bike', fit: 'guess' },
  };

  function targetPsiRaw({ riderKg, bikeKg, widthMm, terrain, wheel }) {
    const t = TERRAIN[terrain] || TERRAIN.worn;
    const totalLb = (riderKg + bikeKg) * 2.20462;
    const share = wheel === 'front' ? t.front : 1 - t.front;
    return clamp(t.k * Math.pow(totalLb * share, 0.35) / widthMm, 8, 120);   // load exponent 0.35 and width exponent 1 fitted to Silca outputs
  }
  function targetPsi(o) { return round(targetPsiRaw(o), 0); }
  /* calibrate: keep Silca's result exact at the saved inputs, and move with weight and width using the estimate's shape */
  function calibratedPsi(cal, now) {
    const ref = targetPsiRaw({ riderKg: cal.kg, bikeKg: 0, widthMm: cal.widthMm, terrain: cal.terrain, wheel: now.wheel });
    return Math.round(cal.psi * targetPsiRaw(now) / ref * 2) / 2;
  }
  /* ideal gas: pressure to put in at fillC so it reads `psi` at rideC */
  function fillForRide(psi, fillC, rideC) {
    const abs = psi + 14.7;
    return round(abs * (fillC + 273.15) / (rideC + 273.15) - 14.7, 1);
  }

  /* ---------- heat and sealant ---------- */
  const mult = (tC, a) => clamp(Math.pow(a.q10, (tC - a.refTempC) / 10), 0.5, 3);

  /* effective days of drying between two dates, using rides for temperature */
  function effectiveDays(fromMs, toMs, rides, a) {
    const days = Math.max(0, (toMs - fromMs) / DAY);
    if (days === 0) return { eff: 0, days: 0, rideHours: 0, rideCount: 0, avgRideC: null };
    const byDay = new Map();
    let rideHours = 0, rideCount = 0, tSum = 0, tHrs = 0;
    for (const r of rides) {
      if (r.startMs < fromMs || r.startMs > toMs) continue;
      rideCount++;
      const hrs = r.hours || 0;
      rideHours += hrs;
      const k = Math.floor(r.startMs / DAY);
      const o = byDay.get(k) || { tSum: 0, hrs: 0 };
      if (r.tempC != null) { o.tSum += r.tempC * hrs; o.hrs += hrs; tSum += r.tempC * hrs; tHrs += hrs; }
      byDay.set(k, o);
    }
    let eff = 0;
    const n = Math.ceil(days);
    for (let i = 0; i < n; i++) {
      const frac = Math.min(1, days - i);
      const k = Math.floor((fromMs + i * DAY) / DAY);
      const o = byDay.get(k);
      const t = o && o.hrs > 0 ? o.tSum / o.hrs : a.typicalTempC;
      eff += frac * mult(t, a);
    }
    for (const r of rides) {      // extra heat while rolling on pavement
      if (r.startMs < fromMs || r.startMs > toMs) continue;
      const t = r.tempC != null ? r.tempC : a.typicalTempC;
      const rc = r.roadC != null ? r.roadC : t + a.pavementOffsetC;
      eff += (r.hours || 0) / 24 * (mult(rc, a) - mult(t, a)) + (r.km || 0) * a.dayPerKm;
    }
    return { eff, days, rideHours, rideCount, avgRideC: tHrs > 0 ? tSum / tHrs : null };
  }

  /* learned life: each sealant check at effective age e with remaining fraction f
     implies life = e / (1 - f). Blend with the prior. */
  const CHECK_FRAC = { plenty: 0.8, some: 0.5, low: 0.2, dry: 0.0 };
  function learnedLife(prior, checks, a) {
    let life = prior, n = 0;
    for (const c of checks) {
      if (c.eff <= 5) continue;
      const f = CHECK_FRAC[c.level];
      if (f == null) continue;
      const implied = f >= 0.95 ? life : c.eff / Math.max(0.05, 1 - f);
      life = life * (1 - a.learnWeight) + clamp(implied, 20, 400) * a.learnWeight;
      n++;
    }
    return { life, n };
  }

  function sealantState({ tire, sealant, rides, checks, nowMs, a }) {
    const dose = sealant.ml > 0 ? sealant.ml : fullDoseMl(tire.widthMm, sealant.brand, tire.type, tire.doseLevel);
    const full = fullDoseMl(tire.widthMm, sealant.brand, tire.type, tire.doseLevel);
    const fromMs = sealant.dateMs;
    const heat = effectiveDays(fromMs, nowMs, rides, a);
    const cond = a.conditionFactor[tire.condition] || 1;
    const eff = heat.eff * cond;
    const prior = a.brandLife && a.brandLife[sealant.brand] ? a.brandLife[sealant.brand] : a.refLifeDays;
    const myChecks = checks.filter(c => c.dateMs >= fromMs).map(c => ({
      level: c.level, eff: effectiveDays(fromMs, c.dateMs, rides, a).eff * cond }));
    const L = learnedLife(prior, myChecks, a);
    const frac = clamp(1 - eff / L.life, 0, 1);
    const events = (sealant.events || []).filter(e => e.dateMs >= fromMs - 12 * 3600e3);
    const eventMl = events.reduce((s0, e) => s0 + (e.ml || a.mlPerSealEvent), 0);
    const left = Math.max(0, dose * frac - eventMl);
    const needAdd = left < a.triggerFraction * dose || frac <= 0;
    const addMl = needAdd ? Math.max(10, Math.round((dose - left) / 5) * 5) : 0;
    const daysToTrigger = eff >= L.life * (1 - a.triggerFraction) ? 0
      : Math.round((L.life * (1 - a.triggerFraction) - eff) / Math.max(0.5, heat.days > 0 ? eff / heat.days : 1));
    const unc = clamp(0.35 - 0.1 * L.n, 0.12, 0.35);   // share of the estimate
    return {
      levelFrac: dose > 0 ? clamp(left / dose, 0, 1) : 0, eventMl, eventCount: events.filter(e => e.kind !== 'removed').length, leftMl: left, lowMl: left * (1 - unc), highMl: Math.min(dose, left * (1 + unc)), frac, needAdd, addMl,
      effDays: eff, lifeDays: L.life, checksUsed: L.n, days: heat.days, rideHours: heat.rideHours,
      rideCount: heat.rideCount, avgRideC: heat.avgRideC, daysToTrigger, fullMl: full, doseMl: dose,
      confidence: L.n >= 2 ? 'medium' : L.n === 1 ? 'low to medium' : 'low'
    };
  }

  /* ---------- air ---------- */
  function learnedLeakPct(fills, a) {
    // fills: sorted by date, each {dateMs, afterPsi, beforePsi|null, fillC}
    const rates = [];
    fills = fills.slice().sort((x, y) => x.dateMs - y.dateMs);
    for (let i = 1; i < fills.length; i++) {
      const p = fills[i - 1], c = fills[i];
      if (c.beforePsi == null || p.afterPsi == null) continue;
      const d = (c.dateMs - p.dateMs) / DAY;
      if (d < 0.5) continue;
      // remove the effect of temperature and altitude first, so a cold-day reading is not mistaken for a leak
      const pc = p.fillC != null ? p.fillC : a.typicalTempC, cc = c.fillC != null ? c.fillC : pc;
      const noLeak = (p.afterPsi + patm(p.altM || 0)) * (cc + 273.15) / (pc + 273.15) - patm(c.altM != null ? c.altM : (p.altM || 0));
      if (!(noLeak > 0)) continue;
      const pct = (1 - Math.pow(Math.max(0.01, c.beforePsi / noLeak), 1 / d)) * 100;
      if (pct >= 0 && pct < 20) rates.push(pct);
    }
    if (!rates.length) return { pct: a.leakPctPerDay, n: 0 };
    const mean = rates.reduce((s, x) => s + x, 0) / rates.length;
    return { pct: a.leakPctPerDay * (1 - Math.min(1, rates.length / 3)) + mean * Math.min(1, rates.length / 3), n: rates.length };
  }

  const patm = (altM) => 14.696 * Math.exp(-(altM || 0) / 8434);
  function airState({ lastFill, fills, targetPsi: tgt, nowMs, nowC, nowAltM, a }) {
    const leak = learnedLeakPct(fills, a);
    if (!lastFill) return { known: false, tgt, leak };
    const days = Math.max(0, (nowMs - lastFill.dateMs) / DAY);
    let p = lastFill.afterPsi;
    const fillC = lastFill.fillC != null ? lastFill.fillC : a.typicalTempC;
    const fa = lastFill.altM || 0, na = nowAltM != null ? nowAltM : fa;
    if (nowC != null || na !== fa) p = (p + patm(fa)) * ((nowC != null ? nowC : fillC) + 273.15) / (fillC + 273.15) - patm(na);   // temperature and altitude
    p = p * Math.pow(1 - leak.pct / 100, days);
    const tol = 0.20 * tgt, up = 0.05 * tgt;
    const gap = tgt - p;
    return {
      known: true, estPsi: p, tgt, gap, days, leak, needAir: gap > tol, tooHigh: -gap > up,
      addTo: fillForRide(tgt, nowC != null ? nowC : fillC, nowC != null ? nowC : fillC),
      lowPsi: p - (leak.n >= 3 ? 1 : 2) - days * (leak.n >= 3 ? 0.07 : 0.15) * p / 20, highPsi: p + (leak.n >= 3 ? 1 : 2) + days * (leak.n >= 3 ? 0.07 : 0.15) * p / 20,
      confidence: leak.n >= 2 ? 'medium' : 'low'
    };
  }

  /* ---------- importers ---------- */
  const FIT_EPOCH = 631065600;
  const BT = { 0: [1, 'u'], 1: [1, 's'], 2: [1, 'u'], 3: [2, 's'], 4: [2, 'u'], 5: [4, 's'], 6: [4, 'u'], 7: [1, 'str'], 8: [4, 'f'], 9: [8, 'd'],
               10: [1, 'u'], 11: [2, 'u'], 12: [4, 'u'], 13: [1, 'u'], 14: [8, 's'], 15: [8, 'u'], 16: [8, 'u'] };
  function parseFit(buf) {
    const dv = new DataView(buf.buffer ? buf.buffer : buf, buf.byteOffset || 0, buf.byteLength);
    const hs = dv.getUint8(0);
    const sig = String.fromCharCode(dv.getUint8(8), dv.getUint8(9), dv.getUint8(10), dv.getUint8(11));
    if (sig !== '.FIT') throw new Error('Not a FIT file');
    const dataSize = dv.getUint32(4, true);
    let pos = hs;
    const end = Math.min(buf.byteLength, hs + dataSize);
    const defs = {};

/* ---------- derived ---------- */
/* Hookless maximum by nominal (printed) tire width. 25 to 34 and 45 to 54 mm: ETRTO, as reported by BikeRadar.

const LIFE_KM={road:5000,gravel:4000,mtb:3000};
const LIFE_DAYS=1095;
function wear(t){
  const km=S.rides.filter(r=>r.startMs>=t.installMs&&r.km!=null).reduce((s0,r)=>s0+r.km,0);
  const noKm=S.rides.filter(r=>r.startMs>=t.installMs&&r.km==null).length;
  const life=(S.a.tireLifeKm&&S.a.tireLifeKm[t.type])||LIFE_KM[t.type]||4000;
  const days=Math.max(0,Math.round((Date.now()-t.installMs)/DAY)),fa=days/LIFE_DAYS;
  const f=km/life,fe=Math.max(f,fa),by=fa>f?'age':'mileage';
  const auto=fe<0.25?'new':fe<0.6?'good':fe<0.9?'fair':'poor';
  const manual=t.condition&&t.condition!=='auto';
  return {km,noKm,life,f,fa,fe,days,by,auto,cond:manual?t.condition:auto,manual};
}
/* Rated tire life in miles is typed per tire. Miles ridden come from the rides since install (km x 0.621371). No rating typed means no countdown and no mileage alerts. */
function milesLeft(t){const r=+t.ratedMi||0;if(r<=0)return null;const ridden=wear(t).km*0.621371;return {rated:r,ridden,left:Math.max(0,r-ridden)}}
/* Replace-tire rule: plugs and flats since install (a puncture the sealant sealed does not count). Warn at rpWarn, urgent at rpUrgent. Defaults 2 and 3; the rider can change them. */
function repairInfo(t){const ev=((t.sealant&&t.sealant.events)||[]).filter(e=>(e.kind==='plugged'||e.kind==='flat')&&e.dateMs>=(t.installMs||0)),R=S.rider,w=+R.rpWarn>0?+R.rpWarn:2,u=Math.max(+R.rpUrgent>0?+R.rpUrgent:3,w),n=ev.length;

/* One level per tire from both rules: '' fine, '50' smoke-alarm level, '0' siren level. */
function tireLv(t){const q=milesLeft(t),m=!q?'':(q.left<=0?'0':(q.left<=50?'50':'')),r=repairInfo(t).lv;return (m==='0'||r==='0')?'0':((m==='50'||r==='50')?'50':'')}
function rideC(){return now.airC!=null?now.airC:(S.nowC!=null&&S.nowC!==''?+S.nowC:null)}
function advice(t){
  const a=S.a,nowMs=Date.now();
  const rides=S.rides;
  const sealant=sealantStateFor(t,rides,nowMs);
  const est=TG.targetPsi({riderKg:S.rider.riderKg,bikeKg:S.rider.bikeKg,widthMm:t.widthMm,terrain:S.rider.terrain,wheel:t.wheel});
  const cur={riderKg:S.rider.riderKg,bikeKg:S.rider.bikeKg,widthMm:t.widthMm,terrain:S.rider.terrain,wheel:t.wheel};
  const cal=t.cal&&t.cal.psi>0?t.cal:null;let tgt=est,fromSilca=false,calStale=false,scaled=false;
  if(cal){if(cal.terrain===S.rider.terrain){tgt=TG.calibratedPsi(cal,cur);fromSilca=true;scaled=(Math.abs(cal.kg-(S.rider.riderKg+S.rider.bikeKg))>0.05||cal.widthMm!==t.widthMm);}else calStale=true;}

  return {sealant,air,tgt,fromSilca,est,scaled,calStale,overLimit,lim,tgtRaw,limWhy:lm[1],noEtrto:!!t.hookless&&hooklessLimit(t.nominalMm)==null};

/* Sealant lost, in ml, worked out for this tire, this sealant and this hole. No maker or test publishes a loss figure, so this is a calculation, not a measurement:

   - width: a wider tire holds more air and sealant, and takes longer to seal.

  const rows=S.tires.map((t,i)=>`<div class="trow"><div><small class="mute">${t.wheel==='front'?'FRONT':'REAR'}</small><br><b>${esc((t.brand+' '+(t.model||'')).trim()||'Not set')}</b><br><span class="mute">${t.nominalMm||'?'} mm printed · installed ${fmtD(t.installMs)}${t.maxPsi>0?' · max '+t.maxPsi+' PSI':''}</span></div><button class="ghost" data-act="tedit" data-i="${i}">${editTire===i?'Close':'Edit'}</button></div>${editTire===i?tireForm(t):''}`).join('');
  return datalists()+(changing!==null?changeForm(changing):'')+`<h2>Set up your bike</h2>
  <div class="card"><label for="bn">Bike name</label><input id="bn" autocapitalize="words" autocorrect="off" spellcheck="false" data-f="rider.bikeName" value="${esc(S.rider.bikeName||'')}" placeholder="My bike"><p class="mute" style="margin:6px 0 0">One bike for now. Switching between several bikes is not built yet.</p></div>
  <div class="card"><h3 style="margin-top:0">Rider and bike</h3><div class="row">
  <div><label for="un">Units</label><select id="un" data-units="1"><option value="us"${US()?' selected':''}>US (lb, °F, miles, fl oz, ft)</option><option value="metric"${!US()?' selected':''}>Metric (kg, °C, km, ml, m)</option></select></div><div><label for="cb">Colors</label><select id="cb" data-cb="1"><option value="0"${!S.rider.cb?' selected':''}>Standard</option><option value="1"${S.rider.cb?' selected':''}>Color-blind safe</option></select></div><div><label for="pt">Patterns on dials</label><select id="pt" data-pt="1"><option value="auto"${(S.rider.pat||'auto')==='auto'?' selected':''}>Auto (follow iPhone)</option><option value="on"${S.rider.pat==='on'?' selected':''}>On</option><option value="off"${S.rider.pat==='off'?' selected':''}>Off</option></select></div>
  <div><label for="wu">Weight unit</label><select id="wu" data-wunit="1"><option value="lb"${wu()==='lb'?' selected':''}>Pounds (lb)</option><option value="kg"${wu()==='kg'?' selected':''}>Kilograms (kg)</option></select></div>
  <div><label for="rk">Rider weight, ${wu()}</label><input id="rk" type="number" step="0.5" data-wk="riderKg" value="${fw(S.rider.riderKg)}"></div>
  <div><label for="bk">Bike + gear, ${wu()}</label><input id="bk" type="number" step="0.5" data-wk="bikeKg" value="${fw(S.rider.bikeKg)}"></div></div>
  <div style="display:flex;gap:10px;align-items:center;margin-top:8px"><button class="ghost" data-act="usew" ${lw?'':'disabled'}>Sync</button><span class="mute">From a scale, Apple Health or Strava, or typed in.${lw?` Latest: ${wfmt(lw.kg)} on ${fmtD(lw.ms)}.`:' No imported weight yet.'}</span></div></div>
  ${alertsCard()}<div class="card"><h3 style="margin-top:0">Tires</h3>${rows}<p class="mute" style="margin:6px 0 0">Edit a tire for brand, model, widths, rim width, install date, condition and sealant. The maximum pressure fills in from the app's tire list.</p></div>
  <div class="card"><h3 style="margin-top:0">Main terrain</h3><div class="row"><div><label for="tr">Road surface (Silca style)</label><select id="tr" data-f="rider.terrain">${Object.entries(TG.TERRAIN).map(([v,o])=>`<option value="${v}" ${S.rider.terrain===v?'selected':''}>${o.label}</option>`).join('')}</select></div>
  <div><label for="sf">Usual surface</label><select id="sf" data-f="rider.surface">${Object.keys(ENV.SURFACE).map(v=>`<option value="${v}" ${S.rider.surface===v?'selected':''}>${({chipseal:'Chip seal'})[v]||v.charAt(0).toUpperCase()+v.slice(1)}</option>`).join('')}</select></div></div></div>
  <div class="card"><h3 style="margin-top:0">Replace-tire alerts</h3><p class="mute" style="margin-top:0">A plug or a flat counts. A puncture the sealant sealed does not. These are the same two alerts as the miles-left rule, per tire.</p><div class="row"><div><label for="rw">Smoke-alarm alert at this many plugs and flats</label><input id="rw" type="number" min="1" inputmode="numeric" data-f="rider.rpWarn" value="${S.rider.rpWarn||2}"></div><div><label for="ru">Siren alert at this many</label><input id="ru" type="number" min="1" inputmode="numeric" data-f="rider.rpUrgent" value="${S.rider.rpUrgent||3}"></div></div></div>
  <details class="card"><summary>Quick start</summary><p class="mute">Fills both tires with the Pirelli P Zero Race TLR 4S, 32 mm, an 80 PSI maximum, and your Silca results (rear 60.5 PSI, front 59 PSI at 135 lb, worn pavement). Your weights and everything else stay as they are.</p><button data-act="pirelli">Use my Pirelli 32 mm</button></details>
  ${hist.length?`<div class="card"><h3 style="margin-top:0">Tire history</h3><div class="scroll"><table><thead><tr><th>Wheel</th><th>Tire</th><th>Width</th><th>Installed</th><th>Removed</th><th>Distance</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${h.wheel}</td><td>${esc((h.brand+' '+h.model).trim())}</td><td>${h.widthMm} mm</td><td>${fmtD(h.installMs)}</td><td>${fmtD(h.removedMs)}</td><td>${dR(h.km)} ${dU()}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  <button data-tab="home" style="width:100%">Save and see my tires</button><p class="mute">Everything you enter saves on this device automatically.</p>`;
}
function viewSettings(){return segBar(STABS,stab,'data-stab')+({bike:viewBike,data:viewData,log:viewLog,model:viewModel}[stab]||viewBike)()+`<p class="mute" style="text-align:center;margin:14px 0 0">TyreGuru build ${BUILD}</p>`}
const TABS=[['home','Home',viewHome],['trends','Trends',viewTrends],['settings','Settings',viewSettings]];
function patternsOn(){const m=(S&&S.rider&&S.rider.pat)||'auto';return m==='on'||(m==='auto'&&window.__diffNoColor===true)}

/* ---------- import ---------- */
async function importFiles(files){
  const log=[];let added=[];
  for(const f of files){
    const n=f.name.toLowerCase();
    try{
      if(n.endsWith('.fit')){const r=TG.parseFit(new Uint8Array(await f.arrayBuffer()));added.push(r);log.push(`${f.name}: 1 ride`);}
      else if(n.endsWith('.csv')){
        const text=await f.text();const head=text.slice(0,400).toLowerCase();
        if(/weight/.test(head)&&!/activity type/.test(head)){const w=TG.parseWeightCsv(text);S.weights=S.weights.concat(w).sort((a,b)=>a.ms-b.ms);autoWeight();log.push(`${f.name}: ${w.length} weights`);}
        else{const r=TG.parseGarminCsv(text);added=added.concat(r.rides);log.push(`${f.name}: ${r.rides.length} cycling rides (temperature read as °${r.tempUnitGuess})`);}
      }else if(n.endsWith('.xml')||n.endsWith('.zip')){
        const sc=new TG.AppleScanner();const dec=new TextDecoder();
        const onText=(chunk,fin)=>sc.push(chunk,fin);
        if(n.endsWith('.zip')){
          if(typeof fflate==='undefined')throw new Error('The zip reader did not load. Unzip the file and choose export.xml instead.');
          await new Promise((res,rej)=>{
            const un=new fflate.Unzip();un.register(fflate.UnzipInflate);let found=false;
            un.onfile=file=>{ if(/(^|\/)export\.xml$/.test(file.name)){found=true;file.ondata=(err,d,fin)=>{if(err)return rej(err);onText(dec.decode(d,{stream:!fin}),false);if(fin){sc.push('',true);res();}};file.start();}};
            (async()=>{try{for(let o=0;o<f.size;o+=4194304){const b=new Uint8Array(await f.slice(o,o+4194304).arrayBuffer());un.push(b,o+4194304>=f.size);}
              if(!found)rej(new Error('export.xml was not inside the zip.'));}catch(e){rej(e)}})();
          });
        }else{
          for(let o=0;o<f.size;o+=4194304){const b=new Uint8Array(await f.slice(o,o+4194304).arrayBuffer());onText(dec.decode(b,{stream:true}),false);}
          sc.push('',true);
        }
        S.weights=S.weights.concat(sc.weights).sort((a,b)=>a.ms-b.ms);autoWeight();added=added.concat(sc.rides);
        log.push(`${f.name}: ${sc.rides.length} cycling workouts, ${sc.weights.length} weights`);
      }else log.push(`${f.name}: skipped, unknown type`);
    }catch(e){log.push(`${f.name}: could not read (${e.message})`);}
  }
  if(added.length){
    if(S.example){S.rides=[];S.example=false;S.tires.forEach(t=>{});log.push('Example rides removed.');}
    const before=S.rides.length;S.rides=TG.dedupeRides(S.rides.concat(added));log.push(`${S.rides.length-before} new rides added after removing duplicates between sources.`);
  }
  msg.imp=log.join('  ·  ');save();render();
}

/* ---------- AI ---------- */
function buildPrompt(){
  const out=S.tires.map(t=>{const A=advice(t);return {wheel:t.wheel,tire:`${t.brand} ${t.model||''} (${t.type}) ${t.widthMm} mm, ${Math.round(wear(t).km)} km since install, condition ${wear(t).cond}`,sealant:{brand:t.sealant.brand,appliedOn:fmtD(t.sealant.dateMs),mlPutIn:t.sealant.ml,estimatedMlLeft:Math.round(A.sealant.leftMl),rangeMl:[Math.round(A.sealant.lowMl),Math.round(A.sealant.highMl)],heatAdjustedAgeDays:Math.round(A.sealant.effDays),lifeDays:Math.round(A.sealant.lifeDays),sealsLogged:A.sealant.eventCount,calculationSays:A.sealant.needAdd?`add ${A.sealant.addMl} ml`:'no sealant needed',checks:t.checks.map(c=>fmtD(c.dateMs)+' '+c.level)},
    air:A.air.known?{targetPsi:A.tgt,estimatedPsiNow:Math.round(A.air.estPsi),daysSinceFill:Math.round(A.air.days),leakPctPerDay:+A.air.leak.pct.toFixed(2),calculationSays:A.air.needAir?`add air, fill to ${A.air.fillTo} psi`:A.air.tooHigh?'let air out':'no air needed'}:{targetPsi:A.tgt,note:'no fill logged'}}});
  const r=S.rides.filter(x=>!isProv(x)).slice(-30);
  return `You are the assistant inside TyreGuru, a tubeless tire sealant and air pressure estimator for cyclists. Review the calculated estimates below. The numbers are estimates from a simple model with untested placeholder constants, not measurements.
Rules: keep safety first. Never claim certainty. If the calculation and the data disagree or the confidence is low, say what the rider should check by hand (feel the sealant, use a gauge). Do not invent data. Keep numbers consistent with the calculation unless you explain a specific reason.
Rider ${S.rider.wManual?S.rider.riderKg+' kg':'weight not shared'}, bike ${S.rider.bikeKg} kg, terrain ${S.rider.terrain}, surface ${S.rider.surface}. Ride temperature ${rideC()!=null?Math.round(rideC())+' C':'unknown'}.${US()?' The rider is in the United States: write your answer in US units (miles, degrees F, fluid ounces, pounds) even though the data above is metric.':''}
Recent rides from the rider's own files (last ${r.length}): ${r.map(x=>`${fmtD(x.startMs)} ${x.hours.toFixed(1)}h ${x.km!=null?Math.round(x.km)+'km':''} air ${x.tempC!=null?Math.round(x.tempC):'?'}C road ${x.roadC!=null?Math.round(x.roadC):'?'}C`).join('; ')}
${S.example?'NOTE: this is example data, not a real rider.':''}
Estimates: ${JSON.stringify(out)}
Answer in plain language, under 170 words, in this format: one line per tire for air, one line per tire for sealant (action, amount, one-sentence reason), then one line "Check by hand:" with the single most useful manual check, then one line "Biggest uncertainty:".`;
}
async function askAI(){
  if(stv().refresh){aiOut='AI review is switched off while Strava is connected. Strava\'s API terms are reported to bar using Strava data in AI features. Disconnect Strava to use the AI review.';render();return}
  aiBusy=true;aiOut=null;render();
  try{
    const sample=window.claude&&await window.claude.use('sample');
    if(!sample&&aiUrl()){
      const r=await aiProxy('/review',{method:'POST',body:JSON.stringify({prompt:buildPrompt()})});
      const j=r.j||{};
      if(r.status===200&&j.text)aiOut=`<pre class="ai">${esc(j.text)}</pre><p class="mute">AI text can be wrong. The decisions above come from the calculation.</p>`;
      else if(j.error==='not_configured')aiOut='<p class="mute">The AI review service is not switched on yet (it has no key). The red and green advice above does not need it.</p>';
      else aiOut=`<p class="mute">The AI review could not run: ${esc(j.message||('the service answered '+r.status))} The calculation above still applies.</p>`;
    }
    else if(!sample){aiOut='<p class="mute">AI review is not set up in this app yet. It works inside Claude, or once an AI review service address is added on the Data tab. The red and green advice above does not need it.</p>';}

function sgMatch(pool,q){q=q.trim().toLowerCase();const sc=x=>{const l=x.toLowerCase();if(!q)return 3;if(l.startsWith(q))return 0;if(l.split(/[^a-z0-9]+/).some(w=>w.startsWith(q)))return 1;return l.includes(q)?2:9};
  return pool.map(x=>[sc(x),x]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||a[1].localeCompare(b[1])).slice(0,8).map(a=>a[1])}

  return subQ().list.some(x=>x.item.kind==='tire'&&x.item.brand.toLowerCase()===(kind==='brand'?v:b)&&(kind==='brand'||x.item.model.toLowerCase()===v))}
function sgShow(input,fromFocus){
  input=(input.id&&document.getElementById(input.id))||input;

  const pool=sgPool(kind,input),raw=/^example/i.test(input.value.trim())?'':input.value,exact=pool.some(x=>x.toLowerCase()===raw.trim().toLowerCase()),listed=sgPool(kind,input,true).some(x=>x.toLowerCase()===raw.trim().toLowerCase());
  const q=fromFocus&&exact?'':raw,list=sgMatch(pool,q);   // an example placeholder counts as empty; focusing a filled box lists everything so it can be changed
  let el=$('#sg');if(!el){el=document.createElement('div');el.id='sg';el.className='sg';el.setAttribute('role','listbox');document.body.appendChild(el)}

/* the rider's own additions, offered to the shared list (the service files them for review; see ai-proxy/README.md) */
const subQ=()=>{S.subs=S.subs||{on:true,list:[]};if(!Array.isArray(S.subs.list))S.subs.list=[];return S.subs};
let subBusy=false;
function queueSubmit(it){const q=subQ();if(q.on===false)return 'off';const k=[it.kind,(it.brand||it.name||'').toLowerCase(),(it.model||'').toLowerCase(),it.nominalMm||0].join('|');

async function flushSubs(){const q=subQ();if(!aiUrl()||subBusy||!q.list.some(x=>!x.sent))return;subBusy=true;

function sgAdd(input){
