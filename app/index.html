<style>
/* Layout: phone-style single column app with bottom tab bar; wide screens center it as a 760px column. */
:root{--bg:#f4f3ef;--card:#fff;--ink:#23211f;--mute:#6b6760;--line:#dcd9d1;--frame:#3a3a3a;--red:#d6362c;--redbg:#fae4e2;--green:#3e8e3e;--greenbg:#e2f0e2;--accent:#3a3a3a;
--disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--card:#262523;--ink:#efede8;--mute:#a09b92;--line:#3a3835;--frame:#d8d5ce;--red:#ff6b60;--redbg:#43211f;--green:#6fcb6f;--greenbg:#1f3a1f;--accent:#d8d5ce;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a19;--card:#262523;--ink:#efede8;--mute:#a09b92;--line:#3a3835;--frame:#d8d5ce;--red:#ff6b60;--redbg:#43211f;--green:#6fcb6f;--greenbg:#1f3a1f;--accent:#d8d5ce;color-scheme:dark}
/* Permanent black theme, like the original design */
:root,:root[data-theme]{--bg:#000;--card:#000;--ink:#f2f0eb;--mute:#a9a49b;--line:#34312e;--frame:#d8d5ce;--red:#ff5a4f;--redbg:#000;--green:#4fd06a;--greenbg:#000;--accent:#d8d5ce;color-scheme:dark}
html,body{background:#000}.tag.red,.tag.green{color:#111}
/* Status colors. The color-blind palette (Okabe-Ito blue / yellow / vermillion) is chosen in Settings; patterns are always on. */
:root{--zl:#e53935;--zo:#f2b01e;--zg:#25b34f;--zh:#9b59d6;--tl:#ff6b60;--to:#ffd04a;--tg:#4cd964;--th:#b98cf0}
html[data-cb="1"]{--zl:#d55e00;--zo:#f0e442;--zg:#0072b2;--zh:#cc79a7;--tl:#ff9a4d;--to:#f0e442;--tg:#56b4e9;--th:#e29bc2;--red:#ff8a3d;--green:#56b4e9}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 62px) 24px}
.wrap{max-width:760px;margin:0 auto}h1,h2,h3{font-family:var(--disp);letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px;margin-bottom:8px}h3{font-size:17px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;min-width:0}
.big{border-width:2px}.big.red{border-color:var(--red);background:#000}.big.green{border-color:var(--green);background:#000}
.tag{display:inline-block;font:700 13px var(--disp);letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:4px;color:#fff}
.tag.red{background:var(--red);color:#fff}.tag.green{background:var(--green);color:#fff}.tag.grey{background:var(--mute)}
:root[data-theme="dark"] .tag.red,:root[data-theme="dark"] .tag.green{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.red,:root:not([data-theme="light"]) .tag.green{color:#111}}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 3px}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
button{background:var(--frame);color:var(--bg);border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.warn{background:var(--red);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:8px 0 4px}.meter i{display:block;height:100%}
.meter.red i{background:var(--red)}.meter.green i{background:var(--green)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}.kv b{text-align:right}
.mute{color:var(--mute);font-size:13px}.num{font:700 40px/1 var(--disp);font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:center;padding:calc(6px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
nav .in{display:flex;max-width:760px;width:100%;gap:4px}nav button{flex:1;background:transparent;color:var(--mute);padding:8px 2px;font:600 13px var(--disp);letter-spacing:.08em;text-transform:uppercase}
nav button[aria-current=true]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.seg{display:flex;border:2px solid var(--frame);border-radius:8px;overflow:hidden;margin:8px 0 12px}.seg button{flex:1;background:transparent;color:var(--ink);border:0;border-radius:0;padding:9px 4px;font:600 13px var(--disp);letter-spacing:.06em;text-transform:uppercase}.seg button[aria-current=true]{background:var(--frame);color:var(--bg)}
.gcard{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.gcol{text-align:center;min-width:0}.gcol svg{width:100%;max-width:176px;height:auto}.gcol b{display:block;font:700 20px/1.15 var(--disp);margin-top:2px}.gin{text-align:left;margin-top:8px}.gin label{display:block;font-size:12px;margin-bottom:3px;color:var(--mute)}.gcol small{display:block;color:var(--mute);font-size:12px}.gcol.red b{color:var(--red)}
.sboxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.sbox{border:2px solid var(--frame);border-radius:8px;padding:8px 12px;background:var(--card)}.sbox small{display:block;color:var(--mute);font-size:12px}.sbox b{font:700 21px/1.15 var(--disp)}.sbox.red{border-color:var(--red);background:var(--redbg)}
.fix{font:700 26px/1.2 var(--disp);margin:6px 0}.tap{cursor:pointer}.bikesel{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--frame);border-radius:10px;padding:10px 14px;background:var(--card);font:600 16px var(--body);cursor:pointer}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.stat{border:1px solid var(--frame);border-radius:8px;padding:10px 12px;background:var(--card);margin:8px 0}

.ex{background:var(--redbg);border:1px dashed var(--red);padding:6px 10px;border-radius:6px;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}details summary{cursor:pointer;font-weight:600}pre.ai{white-space:pre-wrap;font:14px/1.5 var(--body);margin:0}
.src{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
</style>

/* ===== TyreGuru core: pure functions, no DOM ===== */
const TG = (() => {
  const DAY = 86400000;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  const b=tok(t.brand),m=tok(t.model);let best=null;

function autoMax(t){

const LIFE_DAYS=1095;
function wear(t){

function rideC(){return now.airC!=null?now.airC:(S.nowC!=null&&S.nowC!==''?+S.nowC:null)}

  const cur={riderKg:S.rider.riderKg,bikeKg:S.rider.bikeKg,widthMm:t.widthMm,terrain:S.rider.terrain,wheel:t.wheel};

  const W=320,H=170,L=34,R=8,T=10,B=26,X=k=>L+(W-L-R)*k/N,Y=v=>T+(H-T-B)*(1-v);
  const path=pts.map((v,k)=>`${k?'L':'M'}${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const evs=(t.sealant.events||[]).filter(e=>e.dateMs>=t0).map(e=>{const k=N*(e.dateMs-t0)/(nowMs-t0);return `<circle cx="${X(k).toFixed(1)}" cy="${Y(pts[Math.max(0,Math.min(N,Math.round(k)))]).toFixed(1)}" r="4" fill="var(--red)"/>`}).join('');
  const km=S.rides.filter(r=>r.startMs>=t.sealant.dateMs).reduce((a,r)=>a+(r.km||0),0);
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sealant left over time, from the last refill to now" style="display:block"><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="var(--line)"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--line)"/><text x="${L-4}" y="${T+8}" text-anchor="end" font-size="10" fill="var(--mute)">full</text><text x="${L-4}" y="${H-B}" text-anchor="end" font-size="10" fill="var(--mute)">0</text><path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>${evs}<path d="M${L},${H-B+3} l-6,10 l12,0 z" fill="var(--ink)"/><text x="${L+10}" y="${H-3}" font-size="11" fill="var(--ink)">Refill</text><text x="${W-R}" y="${H-3}" text-anchor="end" font-size="11" fill="var(--mute)">now</text></svg>`;
  return `<h2>Trends</h2>${segBar(S.tires.map((q,i)=>[i,q.wheel==='front'?'Front':'Rear']),trI,'data-tr')}
  <div class="card"><h3 style="margin-top:0">Sealant left</h3>${svg}${(t.sealant.events||[]).length?'<p class="mute" style="margin:4px 0 0"><span style="color:var(--red)">●</span> a puncture that sealed</p>':''}</div>
  <div class="stat"><span class="mute">Last refill</span><br><b>${fmtD(t.sealant.dateMs)}</b></div>
  <div class="stat"><span class="mute">Since refill</span><br><b>${dR(km)} ${dU()}</b></div>
  <div class="stat" style="background:var(--line)"><span class="mute">The estimate gets better as confirmed refills and sealant checks add up. Log them in Settings, Log.</span></div>`;
}

function setPath(path,val){const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;S.example=S.example}

/* ---------- import ---------- */
async function importFiles(files){
  const log=[];let added=[];
  for(const f of files){
    const n=f.name.toLowerCase();
    try{
      if(n.endsWith('.fit')){const r=TG.parseFit(new Uint8Array(await f.arrayBuffer()));added.push(r);log.push(`${f.name}: 1 ride`);}
      else if(n.endsWith('.csv')){
        const text=await f.text();const head=text.slice(0,400).toLowerCase();
        if(/weight/.test(head)&&!/activity type/.test(head)){const w=TG.parseWeightCsv(text);S.weights=S.weights.concat(w).sort((a,b)=>a.ms-b.ms);autoWeight();log.push(`${f.name}: ${w.length} weights`);}
        else{const r=TG.parseGarminCsv(text);added=added.concat(r.rides);log.push(`${f.name}: ${r.rides.length} cycling rides (temperature read as °${r.tempUnitGuess})`);}
      }else if(n.endsWith('.xml')||n.endsWith('.zip')){
        const sc=new TG.AppleScanner();const dec=new TextDecoder();
        const onText=(chunk,fin)=>sc.push(chunk,fin);
        if(n.endsWith('.zip')){
          if(typeof fflate==='undefined')throw new Error('The zip reader did not load. Unzip the file and choose export.xml instead.');
          await new Promise((res,rej)=>{
            const un=new fflate.Unzip();un.register(fflate.UnzipInflate);let found=false;
            un.onfile=file=>{ if(/(^|\/)export\.xml$/.test(file.name)){found=true;file.ondata=(err,d,fin)=>{if(err)return rej(err);onText(dec.decode(d,{stream:!fin}),false);if(fin){sc.push('',true);res();}};file.start();}};
            (async()=>{try{for(let o=0;o<f.size;o+=4194304){const b=new Uint8Array(await f.slice(o,o+4194304).arrayBuffer());un.push(b,o+4194304>=f.size);}
              if(!found)rej(new Error('export.xml was not inside the zip.'));}catch(e){rej(e)}})();
          });
        }else{
          for(let o=0;o<f.size;o+=4194304){const b=new Uint8Array(await f.slice(o,o+4194304).arrayBuffer());onText(dec.decode(b,{stream:true}),false);}
          sc.push('',true);
        }
        S.weights=S.weights.concat(sc.weights).sort((a,b)=>a.ms-b.ms);autoWeight();added=added.concat(sc.rides);
        log.push(`${f.name}: ${sc.rides.length} cycling workouts, ${sc.weights.length} weights`);
      }else log.push(`${f.name}: skipped, unknown type`);
    }catch(e){log.push(`${f.name}: could not read (${e.message})`);}
  }
  if(added.length){
    if(S.example){S.rides=[];S.example=false;S.tires.forEach(t=>{});log.push('Example rides removed.');}

  const x=stv();x.access=j.access_token;x.refresh=j.refresh_token;x.expires=j.expires_at*1000;if(j.athlete)x.athlete=(j.athlete.firstname||'')+' '+(j.athlete.lastname||'');save()}
async function stravaFresh(){const x=stv();if(!x.refresh)throw new Error('Strava is not connected.');if(!x.access||x.expires<Date.now()+60000)await stravaTokenCall({client_id:x.id,client_secret:x.secret,grant_type:'refresh_token',refresh_token:x.refresh})}
async function stravaGet(path){await stravaFresh();const r=await net('https://www.strava.com/api/v3'+path,{headers:{Authorization:'Bearer '+stv().access}});
  if(r.status===401)throw new Error('Strava sign-in expired. Connect again.');if(r.status===429)throw new Error('Strava rate limit reached. Try again in 15 minutes.');if(r.status>=400)throw new Error('Strava error '+r.status);return JSON.parse(r.text)}
const STRAVA_RIDES=['Ride','GravelRide','MountainBikeRide','EBikeRide','EMountainBikeRide','Handcycle'];
let lastStrava=0;
async function stravaSync(force){
  const x=stv();if(!x.refresh)return;if(!force&&Date.now()-lastStrava<30*60*1000)return;lastStrava=Date.now();

    const me=await stravaGet('/athlete');

    if(x.bikeId===undefined||!x.bikes.some(b=>b.id===x.bikeId))x.bikeId=(x.bikes.find(b=>b.primary)||x.bikes[0]||{}).id||'';
    if(me.weight>0){const ms=Date.now();if(!S.weights.some(w=>w.src==='Strava'&&Math.abs(w.ms-ms)<864e5)){S.weights.push({ms,kg:me.weight,src:'Strava'});S.weights.sort((a,b)=>a.ms-b.ms);autoWeight()}}
    const since=Math.min(...S.tires.map(t=>t.installMs||Date.now()),Date.now()-400*864e5);
    let all=[];for(let page=1;page<=8;page++){const a=await stravaGet('/athlete/activities?per_page=100&page='+page+'&after='+Math.floor(since/1000));all=all.concat(a);if(a.length<100)break}
    const rides=all.filter(a=>STRAVA_RIDES.includes(a.sport_type||a.type)&&!a.trainer&&(!x.bikeId||!a.gear_id||a.gear_id===x.bikeId)).map(a=>({startMs:Date.parse(a.start_date),hours:(a.moving_time||0)/3600,km:(a.distance||0)/1000,tempC:a.average_temp!=null?a.average_temp:null,roadC:null,lat:a.start_latlng&&a.start_latlng[0]!=null?a.start_latlng[0]:undefined,lon:a.start_latlng&&a.start_latlng[1]!=null?a.start_latlng[1]:undefined,source:'Strava'}));
    if(S.example){S.rides=[];S.example=false}
    S.rides=TG.dedupeRides(S.rides.filter(r=>r.source!=='Strava').concat(rides));
    x.last=Date.now();x.count=rides.length;msg.strava=`Strava read: ${rides.length} rides${x.bikes.length?', '+x.bikes.length+' bikes':''}.`;save();render(true);
    if(S.home&&S.rides.some(r=>r.roadC==null)){try{await ENV.enrichRides(S.rides,S.home,S.rider.surface,S.a,()=>{});save();render(true)}catch(e){}}
  }catch(e){msg.strava='Strava: '+e.message;render(true)}
}
function stravaCard(){const x=stv(),on=!!x.refresh;

  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button data-act="stsync">Read Strava now</button><button class="ghost" data-act="stdisc">Disconnect and remove Strava rides</button></div>`
  :`<details ${x.id?'open':''}><summary>Connect Strava (one time)</summary><div class="mute">
  <p><b>1.</b> On strava.com open Settings, then My API Application, and create an application. Set <b>Authorization Callback Domain</b> to <b>localhost</b>. Copy its Client ID and Client Secret here.</p>
  <div class="row"><div><label for="st_id">Client ID</label><input id="st_id" data-st="id" value="${esc(x.id||'')}" inputmode="numeric"></div><div><label for="st_secret">Client secret</label><input id="st_secret" data-st="secret" type="password" value="${esc(x.secret||'')}"></div></div>
  <p><b>2.</b> <button data-act="stopen">Open Strava and allow access</button></p>

  <div class="row"><div><label for="st_code">Address or code</label><input id="st_code" placeholder="http://localhost/?state=&code=..."></div><div style="align-self:end"><button data-act="stconnect">Connect</button></div></div></div></details>`}
  <p class="mute" id="stmsg" aria-live="polite">${esc(msg.strava||'')}</p></div>`}
/* ---------- More automatic sources: Intervals.icu, Withings, WHOOP (read only, your own account) ---------- */
const sx=k=>{S.src=S.src||{};S.src[k]=S.src[k]||{};return S.src[k]};
const enc=encodeURIComponent,formBody=o=>Object.keys(o).map(k=>enc(k)+'='+enc(o[k])).join('&'),ymd=ms=>new Date(ms).toISOString().slice(0,10);
const sinceMs=()=>Math.min(...S.tires.map(t=>t.installMs||Date.now()),Date.now()-400*864e5);
function addWeights(list,name){const seen=new Set(S.weights.filter(w=>w.src===name).map(w=>Math.floor(w.ms/864e5)));let n=0;
  list.forEach(w=>{if(w.kg>20&&w.kg<300){const d=Math.floor(w.ms/864e5);if(!seen.has(d)){seen.add(d);S.weights.push({ms:w.ms,kg:w.kg,src:name});n++}}});
  S.weights.sort((a,b)=>a.ms-b.ms);autoWeight();return n}
function addRides(list,name){if(S.example&&list.length){S.rides=[];S.example=false}S.rides=TG.dedupeRides(S.rides.filter(r=>r.source!==name).concat(list))}
const lastSrc={};
/* Intervals.icu: also carries rides and weight that you connect there from Garmin, Wahoo, Zwift and others */
const ICU_RIDES=['Ride','GravelRide','MountainBikeRide','EBikeRide','EMountainBikeRide'];
async function icuGet(path){const x=sx('icu');
  const r=await net('https://intervals.icu/api/v1/athlete/'+enc(x.id||'0')+path,{headers:{Authorization:'Basic '+btoa('API_KEY:'+x.key)}});
  if(r.status===401||r.status===403)throw new Error('Intervals.icu did not accept the key. Check the key and the athlete ID.');
  if(r.status>=400)throw new Error('Intervals.icu error '+r.status);return JSON.parse(r.text)}
async function icuSync(force){
  const x=sx('icu');if(!x.key)return;if(!force&&Date.now()-(lastSrc.icu||0)<30*60*1000)return;lastSrc.icu=Date.now();
  try{msg.s_icu='Reading Intervals.icu…';render(true);
    const q='?oldest='+ymd(sinceMs())+'&newest='+ymd(Date.now()+864e5);
    const acts=await icuGet('/activities'+q);
    const rides=(Array.isArray(acts)?acts:[]).filter(a=>ICU_RIDES.includes(a.type)&&!a.trainer&&a.distance>0&&a.moving_time>0).map(a=>({startMs:Date.parse(a.start_date||a.start_date_local),hours:a.moving_time/3600,km:a.distance/1000,tempC:a.average_temp!=null?a.average_temp:null,roadC:null,source:'Intervals.icu'})).filter(r=>!isNaN(r.startMs));
    addRides(rides,'Intervals.icu');
    let nw=0;try{const w=await icuGet('/wellness'+q);nw=addWeights((Array.isArray(w)?w:[]).filter(d=>d.weight>0&&d.id).map(d=>({ms:Date.parse(d.id+'T12:00:00'),kg:d.weight})),'Intervals.icu')}catch(e){if(/did not accept/.test(e.message))throw e}
    x.last=Date.now();x.count=rides.length;x.wcount=nw;msg.s_icu=`Intervals.icu read: ${rides.length} rides, ${nw} new weights.`;save();render(true);
    if(S.home&&S.rides.some(r=>r.roadC==null)){try{await ENV.enrichRides(S.rides,S.home,S.rider.surface,S.a,()=>{});save();render(true)}catch(e){}}
  }catch(e){msg.s_icu='Intervals.icu: '+e.message;render(true)}}
function icuCard(){const x=sx('icu'),on=!!x.last;
  return `<div class="card"><h2>Intervals.icu</h2><p class="mute" style="margin-top:0">Reads your rides and daily weight. Intervals.icu can collect these from Garmin, Wahoo, Zwift and other services, so connecting it here is the closest thing to a live Garmin link. Read only.</p>
  <details ${on?'':'open'}><summary>${on?'Connection details':'Connect Intervals.icu (one time)'}</summary><div class="mute">
  <p>In Intervals.icu open Settings, then Developer Settings, and create an API key. Link your Garmin or other accounts inside Intervals.icu first, so your rides arrive there.</p>
  <div class="row"><div><label for="icu_id">Athlete ID (0 means you)</label><input id="icu_id" data-sx="icu.id" value="${esc(x.id||'')}" placeholder="0"></div><div><label for="icu_key">API key</label><input id="icu_key" data-sx="icu.key" type="password" value="${esc(x.key||'')}"></div></div></div></details>
  ${on?`<p style="margin:4px 0"><b>Connected</b> · ${x.count||0} rides read${x.last?' · '+fmtD(x.last):''}</p>`:''}
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button data-act="icusync">${on?'Read Intervals.icu now':'Connect and read'}</button>${on?'<button class="ghost" data-act="icudisc">Disconnect and remove its data</button>':''}</div>
  <p class="mute" aria-live="polite">${esc(msg.s_icu||'')}</p></div>`}
/* Withings (scales) and WHOOP (body weight): sign in once with your own developer app, like Strava */
const OAUTHS={
  withings:{name:'Withings',what:'the weight from your Withings scale',where:'developer.withings.com',cb:'Set the callback URL to http://localhost.',note:'Withings codes expire after 30 seconds, so paste the address right away.',
    authUrl:x=>'https://account.withings.com/oauth2_user/authorize2?response_type=code&client_id='+enc(x.id||'')+'&scope=user.metrics&redirect_uri='+enc('http://localhost')+'&state=tireguru',
    async token(params){const x=sx('withings');const r=await net('https://wbsapi.withings.net/v2/oauth2',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:formBody(Object.assign({action:'requesttoken',client_id:x.id,client_secret:x.secret},params))});
      const j=JSON.parse(r.text);if(j.status!==0||!j.body||!j.body.access_token)throw new Error('Withings refused the sign-in (code '+j.status+')');
      x.access=j.body.access_token;x.refresh=j.body.refresh_token;x.expires=Date.now()+j.body.expires_in*1000;save()},
    refresh:x=>({grant_type:'refresh_token',refresh_token:x.refresh}),
    async read(x){let list=[],offset=0;for(let i=0;i<6;i++){
      const r=await net('https://wbsapi.withings.net/measure',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded',Authorization:'Bearer '+x.access},body:formBody({action:'getmeas',meastype:1,meastypes:1,category:1,startdate:Math.floor(sinceMs()/1000),enddate:Math.floor(Date.now()/1000),offset})});
      const j=JSON.parse(r.text);if(j.status!==0)throw new Error('Withings error (code '+j.status+')');
      (j.body.measuregrps||[]).forEach(g=>(g.measures||[]).forEach(m=>{if(m.type===1)list.push({ms:g.date*1000,kg:m.value*Math.pow(10,m.unit)})}));
      if(j.body.more&&j.body.offset){offset=j.body.offset}else break}
      return list}},
  whoop:{name:'WHOOP',what:'your body weight',where:'developer.whoop.com',cb:'Add http://localhost as a redirect URL.',note:'WHOOP lets an unapproved app serve up to 10 members, which is enough for your own account.',
    authUrl:x=>'https://api.prod.whoop.com/oauth/oauth2/auth?response_type=code&client_id='+enc(x.id||'')+'&redirect_uri='+enc('http://localhost')+'&scope='+enc('offline read:body_measurement')+'&state=tireguru',
    async token(params){const x=sx('whoop');const r=await net('https://api.prod.whoop.com/oauth/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:formBody(Object.assign({client_id:x.id,client_secret:x.secret},params))});
      const j=JSON.parse(r.text);if(r.status>=400||!j.access_token)throw new Error('WHOOP refused the sign-in'+(j.error_description?': '+j.error_description:''));
      x.access=j.access_token;x.refresh=j.refresh_token||x.refresh;x.expires=Date.now()+(j.expires_in||3600)*1000;save()},
    refresh:x=>({grant_type:'refresh_token',refresh_token:x.refresh,scope:'offline'}),
    async read(x){let r=await net('https://api.prod.whoop.com/developer/v2/user/measurement/body',{headers:{Authorization:'Bearer '+x.access}});
      if(r.status===404)r=await net('https://api.prod.whoop.com/developer/v1/user/measurement/body',{headers:{Authorization:'Bearer '+x.access}});
      if(r.status>=400)throw new Error('WHOOP error '+r.status);const j=JSON.parse(r.text);return j.weight_kilogram>0?[{ms:Date.now(),kg:j.weight_kilogram}]:[]}}
};
async function srcSync(k,force){
  const c=OAUTHS[k],x=sx(k);if(!x.refresh)return;if(!force&&Date.now()-(lastSrc[k]||0)<30*60*1000)return;lastSrc[k]=Date.now();
  try{msg['s_'+k]='Reading '+c.name+'…';render(true);
    if(!x.access||x.expires<Date.now()+60000)await c.token(c.refresh(x));
    const list=await c.read(x);const n=addWeights(list,c.name);
    x.last=Date.now();x.count=list.length;msg['s_'+k]=`${c.name} read: ${list.length} weights${n?', '+n+' new':''}.`;save();render(true);
  }catch(e){msg['s_'+k]=c.name+': '+e.message;render(true)}}
function oauthCard(k){const c=OAUTHS[k],x=sx(k),on=!!x.refresh;
  return `<div class="card"><h2>${c.name}</h2><p class="mute" style="margin-top:0">Reads ${c.what} automatically. Read only.</p>
  ${on?`<p style="margin:4px 0"><b>Connected</b>${x.count!=null?' · '+x.count+' weights read':''}${x.last?' · '+fmtD(x.last):''}</p>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button data-act="srcsync" data-k="${k}">Read ${c.name} now</button><button class="ghost" data-act="srcdisc" data-k="${k}">Disconnect and remove its data</button></div>`
  :`<details ${x.id?'open':''}><summary>Connect ${c.name} (one time)</summary><div class="mute">
  <p><b>1.</b> At ${c.where} create an application. ${c.cb} Copy its Client ID and Client secret here.</p>
  <div class="row"><div><label for="${k}_id">Client ID</label><input id="${k}_id" data-sx="${k}.id" value="${esc(x.id||'')}"></div><div><label for="${k}_secret">Client secret</label><input id="${k}_secret" data-sx="${k}.secret" type="password" value="${esc(x.secret||'')}"></div></div>
  <p><b>2.</b> <button data-act="srcopen" data-k="${k}">Open ${c.name} and allow access</button></p>
  <p><b>3.</b> ${c.name} sends you to a page that will not load (localhost). Copy the whole address from the address bar and paste it here. ${c.note}</p>
  <div class="row"><div><label for="${k}_code">Address or code</label><input id="${k}_code" placeholder="http://localhost/?code=..."></div><div style="align-self:end"><button data-act="srcconnect" data-k="${k}">Connect</button></div></div></div></details>`}
  <p class="mute" aria-live="polite">${esc(msg['s_'+k]||'')}</p></div>`}
const syncAll=()=>{icuSync();srcSync('withings');srcSync('whoop')};
let lastHealth=0;
async function autoHealth(){
  const h=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.health;if(!h)return;
  if(Date.now()-lastHealth<10*60*1000)return;lastHealth=Date.now();
  try{const d=await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('took too long.')),45000);window.__nativeHealth=x=>{clearTimeout(to);res(x)};window.__nativeHealthErr=m=>{clearTimeout(to);rej(new Error(m))};h.postMessage('get')});
    const rides=(d.rides||[]).map(r=>({startMs:r.startMs,hours:r.hours,km:r.km,tempC:null,roadC:null,source:'Apple Health'}));
    if(rides.length){if(S.example){S.rides=[];S.example=false}S.rides=TG.dedupeRides(S.rides.concat(rides))}
    const seen=new Set(S.weights.map(w=>w.ms));(d.weights||[]).forEach(w=>{if(!seen.has(w.ms)){S.weights.push({ms:w.ms,kg:w.kg});seen.add(w.ms)}});S.weights.sort((a,b)=>a.ms-b.ms);autoWeight();
    msg.health=`Apple Health read automatically: ${rides.length} cycling workouts, ${(d.weights||[]).length} weights.`;
  }catch(e){msg.health='Apple Health: '+e.message}
  save();render(true);
}
let lastLoc=0,locBusy=false;
async function fetchNow(){try{if(!S.home)return;msg.now='Looking up…';render(true);const c=await ENV.nowConditions(S.home,S.rider.surface,S.a);Object.assign(now,c);msg.now=''}catch(e){msg.now=netErr(e)}render(true)}
async function autoLocate(force){
  if(locBusy)return;

  }catch(e){msg.loc='Could not get your location automatically: '+e.message+' Allow location for this page or app, or type a town below.'}

}

(function(){try{const c=localStorage.getItem('tg_sealants');if(c&&TG.setSealants(JSON.parse(c)))render()}catch(e){}

  fetch(SEALANT_URL,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&TG.setSealants(j)){try{localStorage.setItem('tg_sealants',JSON.stringify(j))}catch(e){}render()}}).catch(()=>{})})();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
(async()=>{if(!S.example)return;let had=null;try{had=localStorage.getItem(KEY)}catch(e){}if(had||window.__nativeState)return;const j=await idbGet();if(j&&loadJson(j))render()})();
autoLocate();autoHealth();stravaSync();syncAll();
